spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              # k8s Service DNS로 직접 라우팅 (Eureka 등 별도 디스커버리 불필요)
              uri: http://user-service.default.svc.cluster.local:8080
              predicates:
                - Path=/api/users/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-auth
              # k8s Service DNS로 직접 라우팅 (Eureka 등 별도 디스커버리 불필요)
              uri: http://user-service.default.svc.cluster.local:8080
              predicates:
                - Path=/api/auth/**
            - id: user-service-users
              uri: http://user-service.default.svc.cluster.local:8080
              predicates:
                - Path=/api/users/**

# user-service와 반드시 동일해야 하는 JWT 서명 공유 시크릿 (HS256, 최소 32byte)
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-shared-secret-please-change-me-32bytes}

app:
  # credentials:'include' 쿠키 요청을 허용할 FE Origin (와일드카드 불가)
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

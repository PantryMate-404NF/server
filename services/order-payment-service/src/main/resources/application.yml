server:
  port: 8084
spring:
  application:
    name: order-payment-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:-5432}/pantrymate_orderpayment
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

product-service:
  url: http://localhost:8083

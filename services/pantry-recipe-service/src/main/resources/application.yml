server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pantry-recipe-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/pantrymate_pantryrecipe
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ai:
  ocr:
    base-url: ${AI_OCR_BASE_URL:http://ai-serving-svc:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY}
    timeout-seconds: ${AI_OCR_TIMEOUT_SECONDS:30}
  recommend:
    base-url: ${AI_RECOMMEND_BASE_URL:http://ai-serving-svc:8000}
    timeout-ms: ${AI_RECOMMEND_TIMEOUT_MS:1000}

product-service:
  url: ${PRODUCT_SERVICE_URL:http://product-service.default.svc.cluster.local:8083}

product:
  catalog:
    cache-ttl-seconds: 60

pantry:
  expiry:
    # 식재료 사전 매칭 실패(또는 extended_consumption_days 없음) 시 쓰는 기본 여유일수(유통기한 또는 등록일에 더함)
    fallback-extra-days: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

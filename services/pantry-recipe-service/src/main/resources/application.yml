server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pantry-recipe-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/pantrymate_pantryrecipe
    username: ${POSTGRES_USER:pantrymate}
    password: ${POSTGRES_PASSWORD:pantrymate}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

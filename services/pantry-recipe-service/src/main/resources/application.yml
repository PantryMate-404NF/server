server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pantry-recipe-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/pantrymate_pantryrecipe
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    openfeign:
      client:
        config:
          # 서비스 간 조회가 느려져도 사용자 요청이 오래 붙잡히지 않도록 짧게 제한(ms)
          order-payment-service:
            connect-timeout: 500
            read-timeout: 1500
          product-service:
            connect-timeout: 500
            read-timeout: 3000
          user-service:
            connect-timeout: 500
            read-timeout: 1500

ai:
  sync:
    # AI 서버가 /internal/ai/**를 호출할 때 보내는 X-Internal-Api-Key 값
    internal-api-key: ${AI_INTERNAL_API_KEY}
    # is_staple/allergens는 V5 시딩 이후 응답에 싣는다. 시딩되지 않은 환경에서 true면 기본값(false/빈 배열)이 AI 쪽 사전값을 덮어쓰므로 주의.
    include-curated-ingredient-fields: true
  ocr:
    base-url: ${AI_OCR_BASE_URL:http://ai-serving-svc:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY}
    timeout-seconds: ${AI_OCR_TIMEOUT_SECONDS:30}
  recommend:
    base-url: ${AI_RECOMMEND_BASE_URL:http://ai-serving-svc:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY}
    # AI 서버는 추천을 3초 안에 답하므로 여유를 조금 둔다
    timeout-ms: ${AI_RECOMMEND_TIMEOUT_MS:3500}

product-service:
  url: ${PRODUCT_SERVICE_URL:http://product-service.default.svc.cluster.local:8083}

user-service:
  url: ${USER_SERVICE_URL:http://user-service.default.svc.cluster.local:8081}

order-payment-service:
  url: ${ORDER_PAYMENT_SERVICE_URL:http://order-payment-service.default.svc.cluster.local:8084}

product:
  catalog:
    cache-ttl-seconds: 60

pantry:
  # 팬트리 자동 등록(PANTRY-001). 배송 도메인 도입 전까지 결제 완료 후 delivery-delay-minutes가 지난 주문을 배송 완료로 간주한다.
  auto-register:
    enabled: true
    delivery-delay-minutes: 30
    lookback-days: 7
    min-sync-interval-seconds: 60
  expiry:
    # 식재료 사전 매칭 실패(또는 extended_consumption_days 없음) 시 쓰는 기본 여유일수(유통기한 또는 등록일에 더함)
    fallback-extra-days: 3

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pantry-recipe-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/pantrymate_pantryrecipe
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ai:
  ocr:
    base-url: ${AI_OCR_BASE_URL:http://ai-serving-svc:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY}
    timeout-seconds: ${AI_OCR_TIMEOUT_SECONDS:30}
  recommend:
    base-url: ${AI_RECOMMEND_BASE_URL:http://ai-serving-svc:8000}
    timeout-ms: ${AI_RECOMMEND_TIMEOUT_MS:1000}

pantry:
  expiry:
    # TODO: 미입력시 쓰는 임시 고정값
    default-fallback-extension-days: 3
    # TODO: Ingredient.extendedConsumptionDays 매칭 로직 도입 전까지 쓰는 임시 고정값
    temp-sell-by-to-expiry-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:-5432}/pantrymate_product
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

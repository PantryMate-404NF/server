spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pantrymate_user
    username: pantrymate
    password: pantrymate
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

# gateway-service의 security.jwt.secret과 반드시 동일해야 한다 (HS256, 최소 32byte)
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-shared-secret-please-change-me-32bytes}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:1800}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:1209600}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 카카오 개발자 콘솔에 등록할 Redirect URI. 로컬에서 게이트웨이 없이 직접 테스트할 경우
    # user-service 포트(8080)로, 게이트웨이 경유 시 게이트웨이 주소로 등록한다.
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/login/kakao}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/api/auth/login/naver}

app:
  # 로그인 성공/실패 후 302로 돌려보낼 FE 콜백 페이지
  frontend-callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

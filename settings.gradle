rootProject.name = 'pantrymate-backend'

// 공통 라이브러리 모듈 — 각 서비스 JAR에 포함되어 배포됨
include 'modules:common'

// 플랫폼 서비스 — 비즈니스 로직 없이 다른 서비스를 지원하는 인프라 성격의 서버
// (k8s 환경이므로 discovery-service(Eureka)는 두지 않음 — 서비스 디스커버리는 k8s Service DNS로 대체)
['gateway-service'].each { svc ->
    if (file("platform/${svc}").exists()) {
        include "platform:${svc}"
    }
}

// 마이크로서비스 — 새 서비스 추가 시 이 목록에 이름만 추가하면 됨
['user-service'].each { svc ->
    if (file("services/${svc}").exists()) {
        include "services:${svc}"
    }
}
